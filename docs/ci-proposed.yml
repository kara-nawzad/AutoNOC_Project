# READY-TO-USE CI WORKFLOW — not active from this path.
#
# GitHub's fine-grained app token used for this branch lacks the `workflows`
# permission, so `.github/workflows/ci.yml` could not be updated remotely.
# To activate: copy this file over `.github/workflows/ci.yml` and commit it
# with an account that has workflow-write access (any human push works).
#
# What it adds over the committed deploy-only workflow: a real test job
# (ubuntu-latest, Python 3.12, CPU-only torch wheel first so the multi-GB
# CUDA wheel is skipped), and the fly.io deploy now `needs: test` — a red
# suite stops the deploy.

name: CI & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test suite (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first (slim, as documented in requirements.txt);
          # the later `-r requirements.txt` sees torch satisfied and skips
          # the multi-GB CUDA wheel.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy app
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
