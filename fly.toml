# fly.toml app configuration file for autonoc-project

app = "autonoc-project"
primary_region = "ams"

[env]
  AUTONOC_DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# SQLite contains completed aggregate summaries only, never live engine state.
# Fly provisions the small persistent volume on first deploy if it is absent.
[[mounts]]
  source = "autonoc_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
