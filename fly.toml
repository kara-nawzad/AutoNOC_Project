# fly.toml app configuration file generated for autonoc-project on 2026-08-23T17:51:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "autonoc-project"
primary_region = 'iad'

[build]
  builder = "dockerfile"
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
